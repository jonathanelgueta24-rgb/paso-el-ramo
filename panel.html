<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js"></script></head><body><title>Panel · ¿Paso el ramo?</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#eef2f7;--surface:#fff;--line:#d6dde8;--fg:#16202e;--muted:#5b6778;--ink:#1f4fd1;--star:#f2b100;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--surface:#171e29;--line:#2a3443;--fg:#e8edf4;--muted:#9aa6b7;--ink:#7ea2ff;--star:#ffc531;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:28px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-size:30px;margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-family:var(--f-num);font-size:24px;font-variant-numeric:tabular-nums}
.fact small{color:var(--muted)}
.r{display:grid;grid-template-columns:28px 1fr 40px;gap:8px;align-items:center;font-family:var(--f-num);font-size:13px}
.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--star)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--f-body);color:var(--muted);font-weight:600;font-size:12.5px}
.msg{color:var(--muted);margin:0}
</style>
<div class="wrap">
  <header><span class="eyebrow">¿Paso el ramo? · medición</span><h1>Panel de validación</h1></header>
  <p class="msg" id="msg">Cargando…</p>
  <section class="card" id="c1" hidden><div class="facts" id="facts"></div></section>
  <section class="card" id="c2" hidden><span class="eyebrow">Valoraciones</span><div id="dist"></div></section>
  <section class="card" id="c3" hidden><span class="eyebrow">Por día</span><div class="tbl"><table><thead><tr><th>Día</th><th>Personas</th><th>Cálculos</th><th>Valoraciones</th></tr></thead><tbody id="dias"></tbody></table></div></section>
</div>
<script>
(async function(){
  const C=window.PASO_CONFIG||{},$=s=>document.querySelector(s);
  if(!C.supabaseUrl||!C.supabaseAnonKey){$('#msg').textContent='Falta configurar Supabase en config.js.';return}
  try{
    const r=await fetch(C.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/resumen',{method:'POST',
      headers:Object.assign({apikey:C.supabaseAnonKey,'Content-Type':'application/json'},
        /^eyJ/.test(C.supabaseAnonKey)?{Authorization:'Bearer '+C.supabaseAnonKey}:{}),body:'{}'});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
    $('#facts').innerHTML=[
      ['Personas',d.visitantes,'visitantes únicos'],
      ['Visitas',d.visitas,'cargas de la página'],
      ['Calcularon',d.personas_calcularon,pct(d.personas_calcularon,d.visitantes)+' de las personas'],
      ['Cálculos',d.calculos,(d.personas_calcularon?(d.calculos/d.personas_calcularon).toFixed(1):'—')+' por persona'],
      ['Promedio ★',d.promedio??'—',d.valoraciones+' valoraciones'],
      ['Volvieron',d.recurrentes,'personas en más de un día']
    ].map(([t,v,s])=>`<div class="fact"><span class="eyebrow">${t}</span><b>${v}</b><small>${s}</small></div>`).join('');
    const dist=d.dist||{},max=Math.max(1,...[1,2,3,4,5].map(k=>dist[k]||0));
    $('#dist').innerHTML=[5,4,3,2,1].map(k=>`<div class="r"><span>${k}★</span><div class="bar"><i style="width:${(dist[k]||0)/max*100}%"></i></div><span>${dist[k]||0}</span></div>`).join('');
    $('#dias').innerHTML=(d.por_dia||[]).slice().reverse().map(x=>`<tr><td>${x.dia}</td><td>${x.visitantes}</td><td>${x.calculos}</td><td>${x.valoraciones}</td></tr>`).join('');
    ['#c1','#c2','#c3'].forEach(s=>$(s).hidden=false);
    $('#msg').textContent=d.visitantes?'Datos en vivo desde Supabase. Recarga para actualizar.':'Aún no hay visitas registradas.';
  }catch(e){$('#msg').textContent='No se pudo leer el resumen ('+e.message+'). Revisa config.js y que ejecutaste supabase.sql.'}
})();
</script>
</body></html>
